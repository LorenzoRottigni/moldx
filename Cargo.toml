[package]
name = "moldx"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
walkdir = "2"
futures = "0.3"
fmt = "0.1.0"
owo-colors = "4"
thiserror = "2.0.20"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
