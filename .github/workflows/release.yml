name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'

env:
  CARGO_TERM_COLOR: always
  BINARY: moldx

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --bin moldx

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test e2e --test readme

  build:
    name: Build ${{ matrix.asset }}
    needs: [lint, unit, e2e]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: moldx-linux-x86_64
            archive: tar.gz
            linker: CC_x86_64_UNKNOWN_LINUX_MUSL=musl-gcc
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            asset: moldx-linux-aarch64
            archive: tar.gz
            linker: CC_aarch64_UNKNOWN_LINUX_MUSL=musl-gcc
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: moldx-macos-x86_64
            archive: tar.gz
            linker: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: moldx-macos-aarch64
            archive: tar.gz
            linker: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: moldx-windows-x86_64
            archive: zip
            linker: ''
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: moldx-windows-aarch64
            archive: zip
            linker: ''

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Export linker
        if: matrix.linker != ''
        shell: bash
        run: echo "${{ matrix.linker }}" >> "$GITHUB_ENV"
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir package
          cp "target/${{ matrix.target }}/release/moldx" package/moldx
          archive="${ASSET}-${TAG}.tar.gz"
          tar -czf "$archive" -C package moldx
          sha256sum "$archive" > "$archive.sha256"
      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
          TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/moldx.exe" package/moldx.exe
          $archive = "$env:ASSET-$env:TAG.zip"
          Compress-Archive -Path package/moldx.exe -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}-${{ github.ref_name }}.${{ matrix.archive }}
            ${{ matrix.asset }}-${{ github.ref_name }}.${{ matrix.archive }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Build checksums manifest
        working-directory: artifacts
        run: cat *.sha256 > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
