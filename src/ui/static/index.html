<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoldX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'SF Mono','Fira Code',ui-monospace,monospace;background:#0d1117;color:#c9d1d9;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:#161b22;padding:10px 20px;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:14px;flex-shrink:0}
h1{color:#58a6ff;font-size:1.1rem;letter-spacing:3px;font-weight:700}
.tagline{color:#8b949e;font-size:0.78rem}
.status{margin-left:auto;color:#8b949e;font-size:0.75rem}
main{display:grid;grid-template-columns:1fr 1.6fr 1fr;flex:1;overflow:hidden;gap:1px;background:#30363d}
.panel{background:#0d1117;overflow:hidden;display:flex;flex-direction:column}
.panel-title{padding:8px 14px;background:#161b22;font-size:0.68rem;color:#8b949e;text-transform:uppercase;letter-spacing:1.5px;flex-shrink:0;border-bottom:1px solid #21262d}
.panel-body{flex:1;overflow-y:auto;padding:6px 0}
.module-item{padding:7px 14px;cursor:pointer;border-left:3px solid transparent;transition:border-color .12s,background .12s}
.module-item:hover{background:#161b22;border-left-color:#30363d}
.module-item.selected{background:#1c2128;border-left-color:#58a6ff}
.module-name{font-size:0.85rem;color:#e6edf3}
.module-path{font-size:0.7rem;color:#484f58;margin-top:1px}
.module-tags{font-size:0.7rem;color:#388bfd;margin-top:2px}
.strategy-section{margin-bottom:4px}
.strategy-label{padding:6px 14px 3px;font-size:0.68rem;color:#8b949e;text-transform:uppercase;letter-spacing:1px}
.cmd-row{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 8px}
.cmd-btn{padding:4px 10px;background:#21262d;border:1px solid #30363d;border-radius:5px;color:#c9d1d9;font-size:0.78rem;cursor:pointer;font-family:inherit;transition:border-color .12s,color .12s,background .12s}
.cmd-btn:hover{background:#1c2128;border-color:#58a6ff;color:#e6edf3}
.cmd-btn:active{transform:scale(0.97)}
.running-item{padding:9px 14px;border-bottom:1px solid #21262d}
.ri-header{display:flex;justify-content:space-between;align-items:center}
.ri-cmd{font-size:0.82rem;color:#e6edf3;font-weight:600}
.ri-path{font-size:0.7rem;color:#484f58;margin-top:1px}
.ri-meta{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.badge{padding:2px 7px;border-radius:4px;font-size:0.66rem;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.badge-running{background:#0d2a17;color:#3fb950;border:1px solid #1a5c2a}
.badge-done{background:#0c2135;color:#58a6ff;border:1px solid #1b4b7a}
.badge-failed{background:#2a0d0d;color:#f85149;border:1px solid #5c1a1a}
.badge-killed{background:#2a2010;color:#d29922;border:1px solid #5c4a1a}
.pid-label{font-size:0.68rem;color:#484f58}
.kill-btn{padding:2px 8px;background:transparent;border:1px solid #30363d;border-radius:4px;color:#8b949e;font-size:0.68rem;cursor:pointer;font-family:inherit;transition:border-color .12s,color .12s}
.kill-btn:hover{border-color:#f85149;color:#f85149}
.output{margin-top:5px;background:#010409;border-radius:3px;padding:4px 8px;font-size:0.7rem;color:#6e7681;max-height:55px;overflow:hidden;white-space:pre-wrap;word-break:break-all}
.empty{padding:16px 14px;color:#484f58;font-size:0.8rem;font-style:italic}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#30363d;border-radius:2px}
</style>
</head>
<body>
<header>
  <h1>MOLDX</h1>
  <span class="tagline">Orchestration Engine</span>
  <div class="status" id="status">Loading…</div>
</header>
<main>
  <div class="panel">
    <div class="panel-title">Modules</div>
    <div class="panel-body" id="module-list"><div class="empty">Scanning…</div></div>
  </div>
  <div class="panel">
    <div class="panel-title">Strategies &amp; Commands</div>
    <div class="panel-body" id="command-list"><div class="empty">Select a module</div></div>
  </div>
  <div class="panel">
    <div class="panel-title">Running Instances</div>
    <div class="panel-body" id="running-list"><div class="empty">No processes yet</div></div>
  </div>
</main>
<script>
let modules = [];
let selectedIdx = null;

function statusBadge(s){
  if(s==='Running') return '<span class="badge badge-running">running</span>';
  if(s.startsWith('Done')) return `<span class="badge badge-done">${s}</span>`;
  if(s.startsWith('Failed')) return `<span class="badge badge-failed">failed</span>`;
  if(s==='Killed') return '<span class="badge badge-killed">killed</span>';
  return `<span class="badge">${s}</span>`;
}

async function loadModules(){
  try{
    const r = await fetch('/api/modules');
    modules = await r.json();
    renderModules();
    document.getElementById('status').textContent = `${modules.length} module(s) · auto-refresh on`;
  }catch(e){document.getElementById('status').textContent='Error loading modules';}
}

function renderModules(){
  const el = document.getElementById('module-list');
  if(!modules.length){el.innerHTML='<div class="empty">No modules detected</div>';return;}
  el.innerHTML = modules.map((m,i)=>{
    const name = m.path.split('/').pop()||m.path;
    const tags = Object.keys(m.strategies).sort().join(', ');
    return `<div class="module-item${i===selectedIdx?' selected':''}" onclick="selectModule(${i})">
      <div class="module-name">${name}</div>
      <div class="module-path">${m.path}</div>
      <div class="module-tags">[${tags}]</div>
    </div>`;
  }).join('');
}

function selectModule(i){
  selectedIdx = i;
  renderModules();
  const m = modules[i];
  const el = document.getElementById('command-list');
  const strategies = Object.entries(m.strategies).sort(([a],[b])=>a.localeCompare(b));
  if(!strategies.length){el.innerHTML='<div class="empty">No strategies available</div>';return;}
  el.innerHTML = strategies.map(([strat,cmds])=>`
    <div class="strategy-section">
      <div class="strategy-label">${strat}</div>
      <div class="cmd-row">
        ${cmds.map(c=>`<button class="cmd-btn"
            data-path="${encodeURIComponent(m.path)}"
            data-strategy="${encodeURIComponent(strat)}"
            data-command="${encodeURIComponent(c)}">${c}</button>`).join('')}
      </div>
    </div>`).join('');
  // Attach listeners after render — avoids any inline-onclick quoting issues
  el.querySelectorAll('.cmd-btn').forEach(btn=>btn.addEventListener('click',()=>runCmd(
    decodeURIComponent(btn.dataset.path),
    decodeURIComponent(btn.dataset.strategy),
    decodeURIComponent(btn.dataset.command)
  )));
}

async function runCmd(modulePath, strategy, command){
  try{
    const r = await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({module_path:modulePath,strategy,command})});
    if(!r.ok){const t=await r.text();alert('Error: '+t);return;}
    refreshRunning();
  }catch(e){alert('Error: '+e);}
}

async function refreshRunning(){
  try{
    const r = await fetch('/api/running');
    const procs = await r.json();
    const el = document.getElementById('running-list');
    if(!procs.length){el.innerHTML='<div class="empty">No processes yet</div>';return;}
    el.innerHTML = [...procs].reverse().map(p=>{
      const canKill = p.status==='Running';
      const out = p.last_output ? `<div class="output">${p.last_output.split('\n').slice(-3).join('\n')}</div>` : '';
      return `<div class="running-item">
        <div class="ri-header">
          <span class="ri-cmd">${p.strategy}/${p.command}</span>
          ${canKill?`<button class="kill-btn" onclick="killProc(${p.id})">kill</button>`:''}
        </div>
        <div class="ri-path">${p.module_path}</div>
        <div class="ri-meta">
          ${statusBadge(p.status)}
          ${p.pid?`<span class="pid-label">PID ${p.pid}</span>`:''}
        </div>
        ${out}
      </div>`;
    }).join('');
  }catch(e){}
}

async function killProc(id){
  await fetch(`/api/running/${id}`,{method:'DELETE'});
  refreshRunning();
}

loadModules();
refreshRunning();
setInterval(refreshRunning, 2000);
setInterval(loadModules, 30000);
</script>
</body>
</html>
