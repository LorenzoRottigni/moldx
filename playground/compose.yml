name: moldx-playground

services:
  database:
    build: ./modules/database
    container_name: moldx-database
    environment:
      POSTGRES_USER: playground
      POSTGRES_PASSWORD: playground
      POSTGRES_DB: playground
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playground -d playground"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-server:
    build: ./modules/api-server
    container_name: moldx-api-server
    ports:
      - "3000:3000"

  backend-api:
    build: ./modules/backend-api
    container_name: moldx-backend-api
    ports:
      - "8000:8000"

  gateway:
    build: ./modules/gateway
    container_name: moldx-gateway
    depends_on:
      - api-server
      - backend-api
    ports:
      - "8080:8080"

volumes:
  db-data: